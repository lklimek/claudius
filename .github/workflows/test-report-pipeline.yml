name: Report Pipeline Tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - 'skills/**'
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/test-report-pipeline.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - 'skills/**'
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/test-report-pipeline.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pytest

      - name: Unit tests
        run: python3 -m pytest tests/ -q

      - name: Report pipeline (fixtures)
        run: ./tests/test_report_pipeline.sh

      - name: Watchdog GONE detection (e2e, real tmux)
        run: ./tests/test_agent_watchdog_gone.sh
