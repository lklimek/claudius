name: Report Pipeline Tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - 'skills/**'
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/test-report-pipeline.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - 'skills/**'
      - 'agents/**'
      - 'tests/**'
      - '.github/workflows/test-report-pipeline.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pytest ruff

      - name: Unit tests
        run: python3 -m pytest tests/ -q

      - name: Report pipeline (fixtures)
        run: ./tests/test_report_pipeline.sh

      - name: Watchdog GONE detection (e2e, real tmux)
        run: ./tests/test_agent_watchdog_gone.sh

      - name: Format check
        run: ruff format --check .
