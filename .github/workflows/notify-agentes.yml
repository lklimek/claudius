name: Notify Agentes

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger agentes workflow
        run: |
          gh workflow run --repo lklimek/agentes update.yml
        env:
          # AGENTES_PAT must have either the `actions:write` scope (recommended) or the `repo` scope
          # so that `gh workflow run` can trigger workflows in the lklimek/agentes repository.
          GH_TOKEN: ${{ secrets.AGENTES_PAT }}
